services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: coldemail
      POSTGRES_PASSWORD: coldemail
      POSTGRES_DB: coldemail
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldemail"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
